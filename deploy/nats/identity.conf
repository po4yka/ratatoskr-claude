# The Claude archive service's own stanza of the one reviewed NATS authorization file,
# `ratatoskr-platform/deploy/nats/ratatoskr.conf`, which is authoritative. This copy exists for the
# authorized-broker tests, and the workspace check fails when the two diverge once comments,
# whitespace and the nkey token are ignored. Do not merge it into a host file by hand.
#
# Only the non-secret public-nkey placeholder is replaced at deployment. The seed stays in
# `/etc/ratatoskr/claude.nkey` and is named by `RATATOSKR__RECEIPT__EVENT_BUS_NKEY_SEED_PATH`.
#
# The service never creates topology and has no durable: it publishes its own operation report
# and the eight archive fact subjects, and nothing else. There is no `$JS.API.>`, no `evt.>` and
# no `cmd.>`. A denied publish is visible only in the NATS server log, as a `Publish Violation`.
#
# The identity subscribes to its own inbox prefix, `_INBOX_claude.>`, and to nothing else: every
# connection it opens sets `custom_inbox_prefix("_INBOX_claude")`, so no other service can read its
# JetStream replies.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_CLAUDE_XXXXXX
    permissions: {
        publish: {
            allow: [
                "evt.ai-archive.claude.operation.reported.v1",
                "evt.ai_archive.archive.imported.v1",
                "evt.ai_archive.conversation.added.v1",
                "evt.ai_archive.conversation.updated.v1",
                "evt.ai_archive.project.added.v1",
                "evt.ai_archive.project.updated.v1",
                "evt.ai_archive.artifact.added.v1",
                "evt.ai_archive.artifact.updated.v1",
                "evt.ai_archive.subject.tombstoned.v1",
            ]
        }
        subscribe: { allow: ["_INBOX_claude.>"] }
    }
}
