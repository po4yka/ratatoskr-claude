[workspace]
resolver = "3"
members = [
    "crates/claude-archive",
    "services/claude-archive",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSD-3-Clause"
repository = "https://github.com/po4yka/ratatoskr-claude"

[workspace.dependencies]
ratatoskr-claude-archive = { version = "=0.1.0", path = "crates/claude-archive" }
tokio     = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7.19", features = ["io-util"] }
axum      = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
async-nats = "0.50.0"
tower     = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
sqlx      = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
] } # deliberately no "migrate" feature: the development status forbids migrations
secrecy   = "0.10.3"
sha2      = "0.10.9"
tracing   = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter", "fmt", "json"] }
metrics   = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
uuid      = { version = "1.24.1", features = ["v7"] }
serde     = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
zip       = { version = "8.6.0", default-features = false, features = ["deflate"] }
ratatoskr-identifiers = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "9b700fc4de2a0f8c4d61115aaa563dd999dca18b" }
ratatoskr-ai-archive-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "9b700fc4de2a0f8c4d61115aaa563dd999dca18b" }
ratatoskr-operation-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "9b700fc4de2a0f8c4d61115aaa563dd999dca18b" }
ratatoskr-event-envelope = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "9b700fc4de2a0f8c4d61115aaa563dd999dca18b" }

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_docs                  = "deny"
missing_debug_implementations = "deny"
unreachable_pub               = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
dbg_macro          = "deny"
todo               = "deny"
print_stdout       = "deny"
indexing_slicing   = "deny"
string_slice       = "deny"

[profile.release]
debug = 1 # line tables only; panic strategy stays "unwind" ON PURPOSE
